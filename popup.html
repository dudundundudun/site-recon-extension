<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Site Recon for AI</title>
  <style>
    :root {
      --bg: #0f1115;
      --card: #181b22;
      --border: #2a2f3a;
      --text: #e6e8ee;
      --muted: #949ba6;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --danger: #ef4444;
      --danger-hover: #dc2626;
      --success: #10b981;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      width: 390px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 16px;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.2px;
    }
    .badge {
      font-size: 11px;
      background: #1e293b;
      color: #60a5fa;
      padding: 3px 8px;
      border-radius: 99px;
      border: 1px solid #334155;
    }
    .big-btn {
      width: 100%;
      padding: 15px 14px;
      font-size: 14.5px;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(59, 130, 246, 0.35);
      transition: transform 0.1s ease, background 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .big-btn:hover:not(:disabled) {
      background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%);
    }
    .big-btn:active:not(:disabled) {
      transform: scale(0.985);
    }
    .big-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    .rec-btn {
      width: 100%;
      margin-top: 8px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .rec-btn:hover:not(:disabled) {
      background: #222731;
      border-color: var(--danger);
    }
    .rec-btn.recording {
      background: rgba(239, 68, 68, 0.14);
      border-color: var(--danger);
      color: #fca5a5;
    }
    .rec-btn.recording:hover:not(:disabled) {
      background: rgba(239, 68, 68, 0.24);
    }
    .status {
      margin-top: 10px;
      font-size: 12px;
      color: var(--muted);
      text-align: center;
      min-height: 18px;
    }
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }
    .small-btn {
      padding: 8px 6px;
      font-size: 11.5px;
      font-weight: 600;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s;
    }
    .small-btn:hover:not(:disabled) {
      background: #222731;
      border-color: #3b82f6;
    }
    .small-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .preview-box {
      margin-top: 12px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px;
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 11px;
      color: #cbd5e1;
      max-height: 210px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
      display: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="title">⚡ Разведчик сайта для ИИ</div>
    <span class="badge">MV3 Recon</span>
  </div>

  <!-- ОДНА БОЛЬШАЯ КНОПКА -->
  <button id="scanBtn" type="button" class="big-btn">
    <span>🚀 СДЕЛАТЬ ПОЛНЫЙ СЛЕПОК САЙТА</span>
  </button>

  <!-- КНОПКА ЗАПИСИ СЕССИИ -->
  <button id="recordBtn" type="button" class="rec-btn">
    <span>🔴 Записать флоу (переходы, клики, API)</span>
  </button>

  <div id="status" class="status">Нажми кнопку, чтобы собрать архитектуру страницы</div>

  <!-- ТРИ МАЛЕНЬКИЕ КНОПКИ ЭКСПОРТА -->
  <div class="actions">
    <button id="copyAiBtn" type="button" class="small-btn" disabled>📋 Промпт ИИ</button>
    <button id="copyJsonBtn" type="button" class="small-btn" disabled>{ } JSON</button>
    <button id="downloadBtn" type="button" class="small-btn" disabled>💾 Скачать</button>
  </div>

  <pre id="preview" class="preview-box"></pre>

  <script src="popup.js"></script>
</body>
</html>
